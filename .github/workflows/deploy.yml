```yaml
name: Deploy Flet Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Construir aplicación Flet
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.5
          pip install flet-web==0.86.5

      - name: Construir aplicación web
        run: |
          flet build web \
            --module-name app.py \
            --base-url /taller-bits/ \
            --route-url-strategy hash \
            --yes

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir aplicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
```

